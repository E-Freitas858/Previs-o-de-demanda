version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: adega_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: adega
      MYSQL_USER: adega
      MYSQL_PASSWORD: adega123
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data:
